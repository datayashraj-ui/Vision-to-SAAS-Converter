name: NEXUS CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "products/**"
      - "infrastructure/**"
  push:
    branches: [main]
    paths:
      - "products/**"
      - "infrastructure/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/voiceforge

jobs:
  # ── PR Checks ─────────────────────────────────────────────
  ai-code-review:
    name: AI Code Review (Continue CLI)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Continue CLI
        run: npm install -g @continuedev/continue-cli

      - name: Run AI Code Review
        run: |
          continue review \
            --changed-only \
            --checks .continue/checks/ \
            --output sarif \
            --fail-on quality < 6
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post Review Summary to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            try {
              const review = JSON.parse(fs.readFileSync('continue-review.json', 'utf8'));
              const body = `## AI Code Review\n\n${review.summary}\n\n**Score:** ${review.score}/10`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } catch (e) {
              console.log('No review output found');
            }

  # ── Security Scans ────────────────────────────────────────
  secrets-scan:
    name: Secrets Detection (TruffleHog)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  security-scan:
    name: Static Security Analysis (Semgrep)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/typescript
            p/nextjs
            p/react
          generateSarif: "1"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ── Tests ─────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: voiceforge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: products/voice-ai-saas
        run: npm ci

      - name: Run Type Check
        working-directory: products/voice-ai-saas
        run: npm run type-check

      - name: Run Linter
        working-directory: products/voice-ai-saas
        run: npm run lint

      - name: Run Database Migrations
        working-directory: products/voice-ai-saas
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgresql://test:testpass@localhost:5432/voiceforge_test

      - name: Run Unit Tests
        working-directory: products/voice-ai-saas
        run: npm test -- --coverage
        env:
          DATABASE_URL: postgresql://test:testpass@localhost:5432/voiceforge_test
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}

      - name: Upload Coverage
        uses: codecov/codecov-action@v4

  # ── Build & Push Docker Image ─────────────────────────────
  build:
    name: Build ARM64 Docker Image
    runs-on: ubuntu-latest
    needs: [secrets-scan, security-scan, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and Push (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: products/voice-ai-saas
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  # ── Deploy to Oracle Cloud via Coolify ────────────────────
  deploy:
    name: Deploy to Production (Coolify)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Trigger Coolify Deployment
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -d '{"uuid": "${{ secrets.COOLIFY_APP_UUID }}"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [ "$http_code" != "200" ]; then
            echo "Deployment failed with status $http_code"
            echo "Response: $body"
            exit 1
          fi

          echo "Deployment triggered successfully"
          echo "Response: $body"

      - name: Wait for Deployment
        run: |
          echo "Waiting 60 seconds for deployment to complete..."
          sleep 60

      - name: Health Check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VOICEFORGE_URL }}/api/health")

          if [ "$response" != "200" ]; then
            echo "Health check failed: HTTP $response"
            exit 1
          fi

          echo "Health check passed ✓"

      - name: Notify CEO Agent on Success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_FOUNDER_ID }}\",
              \"text\": \"🚀 Deployed! VoiceForge v$(git rev-parse --short HEAD) is live. All health checks passed.\",
              \"parse_mode\": \"Markdown\"
            }"

      - name: Notify CEO Agent on Failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_FOUNDER_ID }}\",
              \"text\": \"🔴 Deployment FAILED for commit $(git rev-parse --short HEAD). Check GitHub Actions for details. I've auto-triggered a rollback.\",
              \"parse_mode\": \"Markdown\"
            }"

          # Trigger rollback
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_URL }}/api/v1/rollback" \
            -d '{"uuid": "${{ secrets.COOLIFY_APP_UUID }}"}'
